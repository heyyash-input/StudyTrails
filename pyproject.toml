[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "studytrails"
version = "0.2.2"
description = "A personal multi-subject AI study coach with tools, local progress, and an offline demo."
readme = "docs/PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "openai>=2.0,<3",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13.0,<15",
    "keyring>=25,<26",
    "platformdirs>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8.0,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
studytrails = "study_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["study_agent"]

[tool.hatch.build.targets.sdist]
include = ["/study_agent", "/tests", "/docs", "/assets", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/pyproject.toml", "/uv.lock", "/.python-version"]
