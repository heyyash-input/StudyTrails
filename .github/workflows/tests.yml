name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - run: uv venv .venv-wheel
      - name: Install and smoke-test wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          uv pip install --python .venv-wheel/Scripts/python.exe dist/studytrails-0.2.0-py3-none-any.whl
          uv run --no-project --no-sync --python .venv-wheel/Scripts/python.exe python tests/wheel_smoke.py
      - name: Install and smoke-test wheel (Linux)
        if: runner.os != 'Windows'
        run: |
          uv pip install --python .venv-wheel/bin/python dist/studytrails-0.2.0-py3-none-any.whl
          uv run --no-project --no-sync --python .venv-wheel/bin/python python tests/wheel_smoke.py
